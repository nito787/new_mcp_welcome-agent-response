version: '3.8'

services:
  mcp-server:
    build: .
    ports:
      - "8001:8001"
    environment:
      - SMTP_HOST=${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-your_smtp_user}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-your_smtp_password}
      - EMAIL_TO=${EMAIL_TO:-your_email@example.com}
      - EMAIL_FROM=${EMAIL_FROM:-your_smtp_user}
      - PORT=8001
    volumes:
      - ./data:/app/data
    restart: unless-stopped